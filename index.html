    const KEY = "yoru-jihanki-pocket";
    const moodName = Object.fromEntries(MOODS);
    let phase = "idle";
    let current = null;
    let pocket = [];
    let busy = false;
    let confirmClear = false;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function byId(id) { return CANS.find((can) => can.id === id); }
    function pick(mood, recent) {
      const poolAll = CANS.filter((can) => can.mood === mood);
      const fresh = poolAll.filter((can) => !recent.includes(can.id));
      const pool = fresh.length ? fresh : poolAll;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function tone(freq, dur, type) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
      osc.onended = () => ctx.close();
    }
    function sleep(ms) { return new Promise((r) => setTimeout(r, reduce ? 0 : ms)); }
    function save() { localStorage.setItem(KEY, JSON.stringify(pocket)); }

    function vesselOf(can) { return BOTTLES.has(can.id) ? "bottle" : "can"; }

      const h = height || (kind === "bottle" ? 112 : 96);

        return `<svg viewBox="0 0 64 128" width="${Math.round(h * 0.5)}" height="${h}" aria-hidden="true"><rect x="26" y="2" width="12" height="9" rx="1.5" fill="#e6a15c"/><path d="M28 11h8v8h5l5 16v68a12 12 0 0 1-12 12H30a12 12 0 0 1-12-12V35l5-16h5z" fill="#f2efe6" fill-opacity="0.16" stroke="#f2efe6" stroke-opacity="0.55" stroke-width="1.5"/><path d="M20 78h24v22a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z" fill="#e6a15c" fill-opacity="0.9"/><rect x="19" y="56" width="26" height="16" rx="2" fill="#0c0d11"/></svg>`;
      }
      return `<svg viewBox="0 0 64 100" width="${Math.round(h * 0.64)}" height="${h}" aria-hidden="true"><ellipse cx="32" cy="16" rx="18" ry="6" fill="#9a9aa3"/><path d="M14 16h36v66a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z" fill="#f2efe6"/><rect x="14" y="38" width="36" height="24" fill="#e6a15c"/><ellipse cx="32" cy="16" rx="10" ry="3" fill="#0c0d11"/><rect x="29" y="10" width="6" height="5" rx="1" fill="#3a2412"/></svg>`;
    }

    function render() {
      document.getElementById("line").textContent =
        phase === "vend" ? "……落ちてくる。" :
        phase === "jam" ? "つかえた。ゆすって。" :
        phase === "shaking" ? "……カラカラ。" :
        phase === "out" && current ? current.name :
        phase === "kept" ? "ポケットに入れた。" :
        "ボタンを押すと、缶かボトルが落ちます。";
      document.getElementById("machine").classList.toggle("shake-body", phase === "shaking");
      const glass = document.getElementById("glass");
      if (phase === "vend" && current) {
        glass.innerHTML = `<div class="sheen"></div><div class="drop"><div class="falling">${vesselSVG(vesselOf(current), 112)}</div></div>`;
      } else if ((phase === "jam" || phase === "shaking") && current) {
        glass.innerHTML = `<div class="sheen"></div><div class="drop"><div class="stuck">${vesselSVG(vesselOf(current), 112)}</div></div>`;
      } else {
        glass.innerHTML = `<div class="sheen"></div><div class="shelf">${vesselSVG("can", 64)}${vesselSVG("bottle", 80)}${vesselSVG("can", 64)}${vesselSVG("bottle", 80)}</div>`;
      }
      const slot = document.getElementById("slot");
      const locked = phase === "vend" || phase === "jam" || phase === "shaking";
      document.querySelectorAll(".mood").forEach((btn) => { btn.disabled = locked; });
      if (phase === "jam") {
        slot.innerHTML = '<p class="label">取り出し口</p><button type="button" class="shake" id="shake">ゆする</button>';
        document.getElementById("shake").onclick = () => void doShake();
      } else if (phase === "out" && current) {
        const held = pocket.includes(current.id);
        const kind = current.mood === "secret" ? "売ってない" : moodName[current.mood];
        const shape = vesselOf(current) === "bottle" ? "ペットボトル" : "缶";
        slot.innerHTML =
          '<p class="label">取り出し口</p>' +
          '<article class="product can-in">' +
          vesselSVG(vesselOf(current), 96) +
          '<div><p class="kind"></p><h2></h2><p class="blurb"></p><p class="effect"></p></div></article>' +
          (held
            ? '<button type="button" class="ghost" id="act">閉じる</button>'
            : '<button type="button" class="primary" id="act">ポケットへ</button><p class="warn">取らないと、次の一本で戻ってしまう。</p>') +
          '<button type="button" class="ghost" id="share">結果をシェア</button><p class="warn" id="share-note" hidden></p>';
        slot.querySelector(".kind").textContent = kind + "　" + shape;
        slot.querySelector("h2").textContent = current.name;
        slot.querySelector(".blurb").textContent = current.line;
        slot.querySelector(".effect").textContent = "副作用　" + current.effect;
        document.getElementById("act").onclick = held ? () => { phase = "idle"; current = null; render(); } : take;
        document.getElementById("share").onclick = () => void shareResult();
      } else {
        slot.innerHTML = '<p class="label">取り出し口</p><p class="empty">からっぽ。上のボタンで一本。</p>';
      }
      document.getElementById("count").textContent = "ポケット　" + pocket.length;
      const clear = document.getElementById("clear");
      clear.hidden = pocket.length === 0;
      clear.textContent = confirmClear ? "ほんとうに空にする" : "空にする";
      document.getElementById("empty").hidden = pocket.length > 0;
      const row = document.getElementById("row");
      row.innerHTML = "";
      pocket.forEach((id) => {
        const can = byId(id);
        if (!can) return;
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML = vesselSVG(vesselOf(can), 36);
        const name = document.createElement("b");
        name.textContent = can.name;
        const tag = document.createElement("small");
        tag.textContent = can.mood === "secret" ? "ひみつ" : vesselOf(can) === "bottle" ? "ペットボトル" : "缶";
        btn.append(name, tag);
        btn.onclick = () => { if (busy) return; current = can; phase = "out"; confirmClear = false; render(); };
        li.append(btn);
        row.append(li);
      });
    }

    async function vend(mood) {
      if (busy) return;
      busy = true;
      confirmClear = false;
      const jammed = Math.random() < 0.14;
      current = jammed ? null : pick(mood, pocket);
      phase = "vend";
      render();
      tone(880, 0.08, "square");
      await sleep(780);
      if (jammed) {
        current = pick(mood, pocket);
        phase = "jam";
        busy = false;
        render();
        return;
      }
      phase = "out";
      tone(180, 0.18, "triangle");
      busy = false;
      render();
    }
    async function doShake() {
      if (busy || phase !== "jam") return;
      busy = true;
      phase = "shaking";
      render();
      tone(140, 0.12, "sawtooth");
      await sleep(420);
      current = pick("secret", pocket);
      phase = "out";
      tone(520, 0.14, "triangle");
      busy = false;
      render();
    }
    const SHARE_URL = "https://mofu-mitsu.github.io/yoru-jihanki/";
    async function shareResult() {
      if (!current) return;
      const text = [
        "よるの自販機で「" + current.name + "」が出た。",
        current.line,
        "副作用　" + current.effect,
        "#よるの自販機",
        SHARE_URL,
      ].join("\n");
      const note = document.getElementById("share-note");
      try {
        if (navigator.share) {
          await navigator.share({ title: "よるの自販機", text });
          if (note) { note.hidden = false; note.textContent = "シェアした。"; }
          return;
        }
        await navigator.clipboard.writeText(text);
        if (note) { note.hidden = false; note.textContent = "コピーした。#よるの自販機 付き。"; }
      } catch (err) {
        if (err && err.name === "AbortError") return;
        try {
          await navigator.clipboard.writeText(text);
          if (note) { note.hidden = false; note.textContent = "コピーした。#よるの自販機 付き。"; }
        } catch (_) {
          if (note) { note.hidden = false; note.textContent = "シェアできなかった。"; }
        }
      }
    }
    function take() {
      if (!current) return;
      pocket = [current.id, ...pocket.filter((id) => id !== current.id)];
      save();
      current = null;
      phase = "kept";
      render();
    }
    document.getElementById("clear").onclick = () => {
      if (!confirmClear) { confirmClear = true; render(); return; }
      const held = current && pocket.includes(current.id);
      pocket = [];
      confirmClear = false;
      save();
      if (held) { current = null; phase = "idle"; }
      render();
    };
    const moods = document.getElementById("moods");
    MOODS.forEach(([id, label, hint]) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mood";
      const name = document.createElement("b");
      name.textContent = label;
      const sub = document.createElement("small");
      sub.textContent = hint;
      btn.append(name, sub);
      btn.onclick = () => void vend(id);
      moods.append(btn);
    });
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "[]");
      if (Array.isArray(raw)) pocket = raw.filter((id) => typeof id === "string" && byId(id));
    } catch (_) {}
    function tick() {
      document.getElementById("clock").textContent = new Intl.DateTimeFormat("ja-JP", {
        hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Asia/Tokyo",
      }).format(new Date());
    }
    tick();
    setInterval(tick, 10000);
    render();
  </script>
</body>
</html>
